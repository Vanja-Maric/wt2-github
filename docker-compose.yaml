services:
  # Database service
  database:
    image: postgres:15
    container_name: postgres-db
    env_file:
      - .env 
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Backend service (Dotnet app)
  dotnet-app:
    build:
      context: .
      dockerfile: Dockerfile.production
    container_name: dotnet-app
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - app-network

  # Frontend service (React app)
  frontend:
    build:
      context: ./wt2-frontend
      dockerfile: Dockerfile 
    container_name: react-app
    ports:
      - "3000:80"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
